#Whether starting structure planning and placement are enabled.
enabled = true
#Preferred search radius in blocks around the theoretical spawn.
# Default: 1024
# Range: 0 ~ 30000000
preferredSearchRadius = 0
#Maximum search radius in blocks around the theoretical spawn.
# Default: 4096
# Range: 0 ~ 30000000
maximumSearchRadius = 0
#Candidate spacing in blocks inside the preferred search radius.
# Default: 64
# Range: 1 ~ 30000000
nearCandidateSpacing = 1
#Candidate spacing in blocks outside the preferred search radius.
# Default: 128
# Range: 1 ~ 30000000
farCandidateSpacing = 1
#Maximum number of candidates considered by the coarse search.
#Rotations that give the structure the same footprint extent are
#evaluated once and count once against this limit.
#Values above 16384 are reset to the default when the file is loaded.
# Default: 4096
# Range: 1 ~ 16384
maximumCoarseCandidates = 1
#Number of top coarse candidates evaluated by the fine search.
#Values above 128 are reset to the default when the file is loaded.
# Default: 32
# Range: 1 ~ 128
fineCandidateCount = 1
#Sampling step in blocks during fine evaluation.
# Default: 4
# Range: 1 ~ 30000000
fineSampleStep = 1
#Maximum generator queries allowed for one planning operation.
#Values above 500000 are reset to the default when the file is loaded.
# Default: 150000
# Range: 1 ~ 500000
maximumGeneratorQueries = 5000
#Terrain blend width in blocks outside the structure footprint.
#Values above 128 are reset to the default when the file is loaded.
# Default: 24
# Range: 1 ~ 128
blendWidth = 24
#Maximum number of blocks that terrain may be cut.
# Default: 8
# Range: 0 ~ 30000000
maximumCutDepth = 8
#Maximum number of blocks that terrain may be filled.
# Default: 8
# Range: 0 ~ 30000000
maximumFillDepth = 8
#Maximum elevation range allowed across the evaluated site.
# Default: 12
# Range: 0 ~ 30000000
maximumElevationRange = 12
#Maximum elevation error allowed at the footprint's edge when a site is chosen. Once the terrain is generated, the cut and fill limits bound the edge instead.
# Default: 4
# Range: 0 ~ 30000000
maximumPerimeterError = 4
#Maximum fraction of sampled columns that may contain water.
# Default: 0.05
# Range: 0.0 ~ 1.0
maximumWaterFraction = 0.05
#Whether supported standalone entities stored in the structure template are placed. Unsupported entity entries are warned and skipped; players, passengers, invalid structural coordinates, and safety-limit violations reject placement.
placeTemplateEntities = true
#Whether every column in the vanilla spawnRadius area must be safe. When false, only the exact spawn marker is validated.
requireSafeSpawnArea = false
#Whether non-preferred land biomes may be accepted with lower priority.
allowUnlistedLandBiomes = true
#Biome tags excluded from site selection.
#This list is the whole list: add your own tags to it.
excludedBiomeTags = ["minecraft:is_ocean", "minecraft:is_river", "minecraft:is_beach", "minecraft:is_mountain"]
#Horizontal rotations that may be selected for the structure.
allowedRotations = ["none"]
#Additional biome IDs treated as preferred.
additionalPreferredBiomes = []
#Additional biome IDs excluded from site selection.
additionalExcludedBiomes = []
#Biome IDs to drop from the built-in preferred list.
#Unknown IDs are ignored with a warning.
removedPreferredBiomes = []
#Biome IDs to drop from the built-in excluded list.
#Unknown IDs are ignored with a warning.
removedExcludedBiomes = []
#Generated structure IDs whose declared bounds are not trusted when checking whether the starting structure would collide with them.
#Applied Energistics 2 declares every meteorite as a flat area of 144x144 blocks around a meteorite a few blocks wide, which rejects sites dozens of blocks away from it.
#A listed structure never counts as a collision; the ground under the site is still checked like any other terrain.
ignoredStructureCollisions = ["ae2:meteorite"]
#What to do with a world whose starting-structure state blocks startup, which happens when the game died during placement.
#'block' refuses to start so the half-modified world is not accepted silently.
#'skip' gives up on the starting structure and loads the world as it is, which may leave partial terrain or structure blocks behind.
blockedStateRecovery = "block"
#Whether a player who arrives at the world spawn is moved onto the structure's spawn marker.
#Vanilla picks a column near the world spawn and puts the player on that column's surface, which for a structure with a roof is the roof, so the marker is otherwise rarely where anyone actually arrives.
#Only applies to players with no bed or charged respawn anchor who arrive inside the vanilla spawn area, and only until placed once.
placePlayerAtSpawnMarker = true
